<!DOCTYPE html>
<html>
    <head>
        <title>Human Capabilities - Aim Trainer</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1 id="text">Aim Trainer</h1>

        <button class="button-default button-enabled">Start</button>
        <button class="button-default button-enabled" style="display: none;" id="resetButton">Reset</button>
        <p id="time">..</p>

            </div>
            <div class="circle inactive"></div>

        </div>    
        <script src="scriptAimtrainer.js"></script>
    </body>
</html>
